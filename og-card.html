<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .bg {
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(ellipse 80% 60% at 50% 0%, rgba(37,99,235,0.22) 0%, transparent 65%),
        radial-gradient(ellipse 50% 40% at 100% 100%, rgba(37,99,235,0.10) 0%, transparent 55%),
        url("data:image/svg+xml,%3Csvg width='80' height='80' viewBox='0 0 80 80' xmlns='http://www.w3.org/2000/svg'%3E%3Cline x1='0' y1='80' x2='80' y2='0' stroke='%233b82f6' stroke-width='0.8' stroke-opacity='0.15'/%3E%3Cline x1='0' y1='0' x2='80' y2='80' stroke='%233b82f6' stroke-width='0.8' stroke-opacity='0.08'/%3E%3C/svg%3E");
      background-size: 100% 100%, 100% 100%, 80px 80px;
    }
    .card {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: space-between;
      width: 1100px;
      height: 530px;
      background: rgba(22,27,34,0.70);
      border: 1px solid rgba(37,99,235,0.35);
      border-radius: 24px;
      padding: 64px 72px;
    }
    .logo svg { display: block; }
    .content { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 40px 0; }
    h1 {
      font-size: 52px;
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -0.02em;
      color: #ffffff;
      margin-bottom: 20px;
      max-width: 820px;
    }
    p {
      font-size: 22px;
      color: #8b949e;
      line-height: 1.6;
      max-width: 700px;
    }
    .footer {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .badge {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #2563eb;
      background: rgba(37,99,235,0.12);
      border: 1px solid rgba(37,99,235,0.3);
      padding: 8px 18px;
      border-radius: 999px;
    }
    .domain {
      font-size: 16px;
      font-weight: 500;
      color: #6e7681;
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="bg"></div>
  <div class="card">
    <div class="logo">
      <svg width="320" height="72" viewBox="0 0 280 64" xmlns="http://www.w3.org/2000/svg">
        <polyline points="24,28 40,12 56,28" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round"/>
        <polyline points="24,28 24,52 56,52 56,28" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linejoin="round"/>
        <line x1="40" y1="12" x2="40" y2="4" stroke="#2563eb" stroke-width="1.5" opacity="0.65"/>
        <line x1="40" y1="4" x2="64" y2="4" stroke="#2563eb" stroke-width="1.5" opacity="0.65"/>
        <circle cx="66" cy="4" r="2.5" fill="#2563eb" opacity="0.9"/>
        <line x1="56" y1="40" x2="66" y2="40" stroke="#2563eb" stroke-width="1.5" opacity="0.55"/>
        <line x1="66" y1="40" x2="66" y2="52" stroke="#2563eb" stroke-width="1.5" opacity="0.55"/>
        <circle cx="66" cy="54" r="2.5" fill="#2563eb" opacity="0.75"/>
        <rect x="34" y="40" width="12" height="12" rx="1.5" fill="none" stroke="#2563eb" stroke-width="1.5" opacity="0.75"/>
        <text x="84" y="30" font-family="Inter,sans-serif" font-size="17" font-weight="800" fill="#ffffff" letter-spacing="-0.5">Property Systems</text>
        <text x="84" y="52" font-family="Inter,sans-serif" font-size="15" font-weight="500" fill="#2563eb" letter-spacing="3.5">LAB</text>
      </svg>
    </div>
    <div class="content">
      <h1>Automation &amp; Operations Support for Property Management</h1>
      <p>AI workflows, CRM optimization, and virtual assistant support — built for property management teams.</p>
    </div>
    <div class="footer">
      <span class="badge">Free Workflow Review</span>
      <span class="domain">propertysystemslab.com</span>
    </div>
  </div>
</body>
</html>
